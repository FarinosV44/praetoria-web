# Sitio de Netlify del PORTAL (aplicación privada con servidor). Es un sitio distinto del de la web pública:
# en Netlify, «Base directory» = portal. La web pública sigue publicándose en Hostinger y no se toca.
[build]
  command = "npm run build"
  publish = ".next"
  # Solo se reconstruye si cambia algo dentro de portal/.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  BETTER_AUTH_TELEMETRY = "0"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["pg", "web-push"]
